let lang = "fr";

function fillList(id, items) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  items.forEach(t => {
    const li = document.createElement("li");
    li.textContent = t;
    el.appendChild(li);
  });
}

function fillTable(id, headers, rows) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  const thead = document.createElement("thead");
  const trh = document.createElement("tr");
  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    trh.appendChild(th);
  });
  thead.appendChild(trh);
  el.appendChild(thead);
  const tbody = document.createElement("tbody");
  rows.forEach(row => {
    const tr = document.createElement("tr");
    row.forEach(cell => {
      const td = document.createElement("td");
      td.textContent = cell;
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  el.appendChild(tbody);
}

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (t[key] !== undefined) el.textContent = t[key];
  });
  fillList("list-s2", t["s2.list"]);
  fillTable("table-t1", t["t1.headers"], t["t1.rows"]);
  fillTable("table-t2", t["t2.headers"], t["t2.rows"]);
  fillList("list-s33", t["s33.list"]);
  fillList("list-s4", t["s4.list"]);
  fillList("list-s5p", t["s5.p"]);
  fillList("list-s5u", t["s5.u"]);
  fillList("list-s5b", t["s5.b"]);
  fillTable("table-risk", t["risk.headers"], t["risk.rows"]);
  fillList("list-s8", t["s8.list"]);
  document.querySelectorAll(".switcher button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
}

document.querySelectorAll(".switcher button").forEach(b => {
  b.addEventListener("click", () => {
    lang = b.dataset.lang;
    render();
  });
});

render();
</script>
